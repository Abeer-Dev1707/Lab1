{% extends "dashboard/dashboard_base.html" %}

{% block title %}
{{ page_title }}
{% endblock %}

{% block dashboard_content %}

<div class="card shadow-sm border-0">

    <div class="card-header d-flex justify-content-between align-items-center">

        <h3 class="mb-0">
            {{ page_title }}
        </h3>

        <a href="{% url 'product_type_list' %}" class="btn btn-secondary">
            <i class="fas fa-arrow-right"></i>
            رجوع
        </a>

    </div>

    <div class="card-body">

        <form method="POST">

            {% csrf_token %}

            <div class="mb-3">

                <label class="form-label">
                    اسم نوع المنتج
                </label>

                {{ form.name }}

            </div>

            <div class="mb-3">

                <label class="form-label">
                    الوصف
                </label>

                {{ form.description }}

            </div>

            <button type="submit" class="btn btn-success">

                <i class="fas fa-save"></i>

                حفظ

            </button>

            <a href="{% url 'product_type_list' %}" class="btn btn-secondary">

                إلغاء

            </a>

        </form>

    </div>

</div>

{% endblock %}
